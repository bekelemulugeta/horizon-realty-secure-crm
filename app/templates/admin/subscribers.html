{% extends "base.html" %}
{% block title %}Subscribers{% endblock %}
{% block content %}
<h1 class="text-2xl font-semibold mb-6">Newsletter Subscribers</h1>

<div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden max-w-md">
    <table class="w-full text-sm">
        <thead class="bg-gray-50 text-gray-500 text-left">
            <tr><th class="px-4 py-3">Email</th><th class="px-4 py-3">Subscribed</th></tr>
        </thead>
        <tbody class="divide-y divide-gray-100">
        {% for s in subscribers %}
            <tr class="hover:bg-gray-50">
                <td class="px-4 py-3">{{ s.email }}</td>
                <td class="px-4 py-3 text-gray-500">{{ s.subscribed_at }}</td>
            </tr>
        {% else %}
            <tr><td colspan="2" class="px-4 py-6 text-center text-gray-400">No subscribers yet.</td></tr>
        {% endfor %}
        </tbody>
    </table>
</div>
<p class="mt-6"><a href="{{ url_for('admin.dashboard') }}" class="text-sky-600 hover:underline text-sm">← Back to admin dashboard</a></p>
{% endblock %}
