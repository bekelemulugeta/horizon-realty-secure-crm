{% extends "base.html" %}
{% block title %}New Staff User{% endblock %}
{% block content %}
<h1 class="text-2xl font-semibold mb-6">New Staff User</h1>

<div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 max-w-lg">
    <!--
      VULN-16 demo: submit this form and it shows password on screen
    -->
    <form method="POST" action="{{ url_for('admin.new_user') }}" class="space-y-3">
        <div class="grid grid-cols-2 gap-3">
            <input type="text" name="first_name" placeholder="First name" required
                   class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm">
            <input type="text" name="last_name" placeholder="Last name" required
                   class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm">
        </div>
        <input type="text" name="username" placeholder="Username" required
               class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Role</label>
            <select name="user_type" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm">
                <option value="sales">Sales</option>
                <option value="admin">Admin</option>
            </select>
        </div>
        <input type="text" name="position" placeholder="Position (e.g. Sales Agent)"
               class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm">
        <input type="text" name="phone" placeholder="Phone"
               class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm">

        <p class="text-xs text-gray-400">
            A default password will be assigned automatically and shown after creation.
        </p>

        <button type="submit" class="bg-sky-600 hover:bg-sky-500 text-white font-medium px-4 py-2 rounded-md text-sm">
            Create user
        </button>
    </form>
</div>
<p class="mt-6"><a href="{{ url_for('admin.users') }}" class="text-sky-600 hover:underline text-sm">← Back to staff accounts</a></p>
{% endblock %}
