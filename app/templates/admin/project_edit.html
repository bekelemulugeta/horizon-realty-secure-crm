{% extends "base.html" %}
{% block title %}Edit Listing{% endblock %}
{% block content %}
<h1 class="text-2xl font-semibold mb-6">Edit Listing</h1>

<div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 max-w-lg">
    {% if project.image_path %}
        <img src="{{ project.image_path }}" alt="{{ project.title }}" class="h-40 w-full object-cover rounded-lg mb-4">
    {% endif %}

    <!-- VULN-08b: no CSRF token -->
    <form method="POST" action="{{ url_for('admin.edit_project', project_id=project.id) }}" enctype="multipart/form-data" class="space-y-3">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Title</label>
            <input type="text" name="title" value="{{ project.title }}" required
                   class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Location</label>
            <input type="text" name="location" value="{{ project.location or '' }}"
                   class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
            <textarea name="description" rows="3"
                      class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm">{{ project.description or '' }}</textarea>
        </div>
        <div class="grid grid-cols-2 gap-3">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Price</label>
                <input type="text" name="price" value="{{ project.price or '' }}"
                       class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Discount price</label>
                <input type="text" name="discount_price" value="{{ project.discount_price or '' }}"
                       class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm">
            </div>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Discount reason</label>
            <input type="text" name="discount_reason" value="{{ project.discount_reason or '' }}"
                   class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Replace cover image</label>
            <!-- VULN-10 (same pattern as elsewhere): no validation at all -->
            <input type="file" name="cover_image" class="text-sm">
        </div>
        <button type="submit" class="bg-sky-600 hover:bg-sky-500 text-white font-medium px-4 py-2 rounded-md text-sm">
            Save changes
        </button>
    </form>

    <!-- VULN-08b: no CSRF token -->
    <form method="POST" action="{{ url_for('admin.delete_project', project_id=project.id) }}"
          onsubmit="return confirm('Delete this listing? This cannot be undone.');" class="mt-4">
        <button type="submit" class="text-red-600 hover:underline text-sm">Delete listing</button>
    </form>
</div>

<p class="mt-6"><a href="{{ url_for('admin.projects') }}" class="text-sky-600 hover:underline text-sm">← Back to projects</a></p>
{% endblock %}
