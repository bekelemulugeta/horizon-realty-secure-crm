{% extends "base.html" %}
{% block title %}Staff Login{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-8 bg-white rounded-xl shadow-sm border border-gray-200 p-8">
    <h1 class="text-2xl font-semibold mb-1">Staff Login</h1>
    <p class="text-sm text-gray-500 mb-6">Sign in to access the sales and admin dashboard.</p>

    <!-- VULN-BASELINE: no CSRF token on this form -->
    <form method="POST" action="{{ url_for('auth.login') }}" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
            <input type="text" name="username" required
                   class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-sky-500">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
            <input type="password" name="password" required
                   class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-sky-500">
        </div>
        <button type="submit"
                class="w-full bg-sky-600 hover:bg-sky-500 text-white font-medium py-2 rounded-md transition">
            Log in
        </button>
    </form>
</div>
{% endblock %}
