{% extends "base.html" %}
{% block title %}Lead #{{ lead.id }}{% endblock %}
{% block content %}
<!--
  VULN-09 demo: 
-->
<div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 max-w-lg">
    <h1 class="text-xl font-semibold mb-4">{{ lead.customer_name }}</h1>
    <dl class="text-sm space-y-2 mb-6">
        <div class="flex justify-between"><dt class="text-gray-500">Phone</dt><dd>{{ lead.phone }}</dd></div>
        <div class="flex justify-between"><dt class="text-gray-500">Status</dt><dd>{{ lead.status }}</dd></div>
        <div class="flex justify-between"><dt class="text-gray-500">Assigned agent id</dt><dd>{{ lead.agent_id }}</dd></div>
    </dl>

    <!-- VULN-08: no CSRF token on this form -->
    <form method="POST" action="{{ url_for('sales.update_lead', lead_id=lead.id) }}" class="space-y-3">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Status</label>
            <select name="status" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm">
                <option value="new" {% if lead.status == 'new' %}selected{% endif %}>New</option>
                <option value="follow_up" {% if lead.status == 'follow_up' %}selected{% endif %}>Follow up</option>
                <option value="deal" {% if lead.status == 'deal' %}selected{% endif %}>Deal</option>
                <option value="achieved" {% if lead.status == 'achieved' %}selected{% endif %}>Achieved</option>
            </select>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Remark</label>
            <textarea name="remark" rows="3"
                      class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm">{{ lead.remark }}</textarea>
        </div>
        <button type="submit" class="bg-sky-600 hover:bg-sky-500 text-white font-medium px-4 py-2 rounded-md text-sm">
            Update
        </button>
    </form>
</div>

<p class="mt-6"><a href="{{ url_for('sales.dashboard') }}" class="text-sky-600 hover:underline text-sm">← Back to dashboard</a></p>
{% endblock %}
