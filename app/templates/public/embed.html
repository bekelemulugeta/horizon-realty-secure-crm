<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ project.title }}</title>
    <!--
      This page is INTENDED to be embedded in an <iframe> on partner sites.
      VULN-14: right now no route in the app sets X-Frame-Options / CSP
      frame-ancestors at all, so this page isn't specially permitted to
      frame -- everything is equally frameable, including staff-facing
      pages, which is the actual problem to fix in the hardened branch
      (deny by default, allow only this route for an allow-listed origin).
    -->
</head>
<body>
    <div style="border:1px solid #ccc; padding:10px; font-family:sans-serif;">
        <h3>{{ project.title }}</h3>
        <p>{{ project.location }} — {{ project.price }}</p>
        <a href="{{ url_for('public.project_detail', project_id=project.id, _external=True) }}">View full listing</a>
    </div>
</body>
</html>
